name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      # GTK is dlopen'd at run time, never linked, but the tray mode needs it
      # present.
      - name: Install GTK
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-0 libglib2.0-0

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go vet
        run: |
          go vet ./...
          GOOS=windows go vet ./...

      - name: Tests
        run: go test -race ./...

      # The end-to-end rehearsal: a mock codex speaking the schema from the
      # Codex source, a synthetic ~/.codex, and the daemon driven through a full
      # cycle — self-check, turns, hitting the limit, waiting. This is the part
      # that would otherwise need a person with an account.
      - name: Daemon rehearsal against a mock codex
        run: ./archive/ci/rehearsal.sh

      # The same rehearsal, but running the Windows build under Wine. The
      # Windows job below is the real check; this one runs alongside the Linux
      # tests and catches platform mistakes — a path joined with the wrong
      # separator, say — before the slower job even starts.
      - name: Install Wine
        run: sudo apt-get install -y --no-install-recommends wine64

      - name: Windows build rehearsed under Wine
        run: ./archive/ci/rehearsal-wine.sh

      # The Windows rehearsal is a PowerShell script, and PowerShell has its own
      # ways to go wrong that have nothing to do with Windows: Set-Content does
      # not write one array element per line, and -match against an array
      # filters instead of testing. Both bugs cost a round trip through CI
      # before pwsh was available here. It runs on Linux, so now it is.
      - name: Windows rehearsal script checked under pwsh
        shell: pwsh
        run: ./archive/ci/rehearsal.ps1

      - name: Cross-compile
        run: |
          set -e
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            flags="-s -w"
            [ "$os" = windows ] && flags="$flags -H windowsgui"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags="$flags" -o /tmp/out ./archive/cmd/crescent
            echo "  $target ok"
          done

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: go vet
        run: go vet ./...

      - name: Tests
        run: go test ./...

      # Windows is the platform neither of us can try by hand, so the rehearsal
      # matters more here than anywhere.
      # The same suite also runs on the Linux job as a Windows binary under
      # Wine, which is where these failures get caught first.
      - name: Daemon rehearsal against a mock codex
        shell: pwsh
        run: ./archive/ci/rehearsal.ps1

      - name: Build as a GUI application
        run: go build -ldflags="-H windowsgui" -o crescent.exe ./archive/cmd/crescent
        env:
          CGO_ENABLED: 0
